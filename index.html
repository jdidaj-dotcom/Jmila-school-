<style>
*{box-sizing:border-box}
body{

header{

main{max-width:950px;margin:auto;padding:16px}
.panel,.lesson{

h2{color:#087b58}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px
}
.subject{
  background:white;border:2px solid #d7e8df;
  border-radius:14px;padding:17px;margin:0;
  text-align:center;cursor:pointer;font-weight:bold;
  color:#087b58;font-size:16px
}
.subject:hover,.subject.active{border-color:#087b58;background:#e7f5ee}
button{
  background:#087b58;color:white;border:0;border-radius:9px;
  padding:12px 16px;font-size:16px;cursor:pointer;margin:5px 0
}
.lesson h3{margin-top:0;color:#087b58}
.lesson h4{color:#075e45}
.small{color:#64766d;font-size:14px;line-height:1.7}
.hidden{display:none}
footer{text-align:center;padding:22px;color:#64766d}
.answer{
  background:#e7f5ee;padding:12px;border-radius:8px;
  margin-top:8px
}
.badge{
  display:inline-block;background:#e7f5ee;color:#075e45;
  padding:5px 9px;border-radius:20px;font-size:13px
}
</style>
</head>

  <p class="small">

</section>

<section class="panel">

</section>

</section>

    <button onclick="answer(120)">120</button>
  </div>
  <p id="result" aria-live="polite"></p>
</section>

</main>

<footer>

  const subjectArea = document.getElementById("subjects");
  const lessonArea = document.getElementById("lessons");

  const availableSubjects = subjects.filter(s => {
    const name = s[0];
    const hasLessons = (lessonData[year] || {})[name];
    return !q || name.toLowerCase().includes(q) ||
      (hasLessons || []).some(l =>
        (l.title + " " + l.explanation).toLowerCase().includes(q)
      );
  });

  subjectArea.innerHTML = availableSubjects.map(s =>
    `<button class="subject ${selected===s[0]?'active':''}"
      onclick="choose('${s[0]}')">${s[1]}<br>${s[0]}</button>`
  ).join("");

  document.getElementById("heading").textContent =
    "📝 " + selected + " — السنة " + year;

  let lessons = ((lessonData[year] || {})[selected] || []);

  if(q){
    lessons = lessons.filter(l =>
      (l.title + " " + l.explanation + " " +
       (l.exercise || "")).toLowerCase().includes(q)
    );
  }

  if(!lessons.length){
    lessonArea.innerHTML =
      "<p>ما زال محتوى هذه المادة أو الدرس غير مدرج هنا. " +
      "باش نزيدوه بعد التثبّت من برنامج السنة المعنية.</p>";
    return;
  }

  lessonArea.innerHTML = lessons.map((l,i) => `
    <article class="lesson">
      <span class="badge">الدرس ${i+1}</span>
      <h3>${l.title}</h3>

      <h4>📘 شرح الدرس</h4>
      <p>${l.explanation}</p>

      ${l.example ? `
        <h4>✏️ مثال</h4>
        <p>${l.example}</p>` : ""}

      ${l.exercise ? `
        <h4>📝 تمرين</h4>
        <p>${l.exercise}</p>` : ""}

      ${l.correction ? `
        <details>
          <summary>✅ إظهار الإصلاح</summary>
          <div class="answer">${l.correction}</div>
        </details>` : ""}
    </article>
  `).join("");
}

function choose(name){
  selected = name;
  document.getElementById("search").value = "";
  render();
  document.getElementById("heading").scrollIntoView({
    behavior:"smooth"
  });
}

function answer(n){
  document.getElementById("result").textContent =
    n===100 ? "أحسنت! إجابة صحيحة 🎉" :
    "حاول مرة أخرى. احسب 25 × 4 من جديد.";
}

render();

</script>
</body>
