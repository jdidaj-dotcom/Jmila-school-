
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المكتبة الرقمية - ابتدائية جميلة الجديدة</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f5;color:#19352b}
header{background:linear-gradient(135deg,#075e45,#10a477);color:white;text-align:center;padding:28px 15px}
header h1{font-size:25px}
header p{line-height:1.8}
main{max-width:950px;margin:auto;padding:16px}
.panel,.subject,.lesson{background:white;border-radius:14px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #18352b10}
h2{color:#087b58}
select,input{width:100%;padding:13px;border:1px solid #ccd9d2;border-radius:9px;font-size:16px;margin:7px 0;background:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.subject{margin:0;text-align:center;cursor:pointer;border:2px solid transparent;font-weight:bold;color:#087b58}
.subject:hover,.subject:focus{border-color:#087b58}
button{background:#087b58;color:white;border:0;border-radius:9px;padding:12px 16px;font-size:16px;cursor:pointer;margin:5px 0}
.lesson h3{margin-top:0}
.small{color:#64766d;font-size:14px;line-height:1.7}
.hidden{display:none}
footer{text-align:center;padding:22px;color:#64766d}
</style>
</head>
<body>
<header>
<h1>🏫 ابتدائية جميلة الجديدة</h1>
<p>📚 المكتبة الرقمية المدرسية<br>نتعلّم اليوم لننجح غدوة</p>
</header>
<main>
<section class="panel">
<h2>📖 مكتبة التلميذ</h2>
<label for="year">اختار السنة الدراسية:</label>
<select id="year" onchange="render()">
<option value="6">السنة السادسة ابتدائي</option>
<option value="5">السنة الخامسة ابتدائي</option>
<option value="4">السنة الرابعة ابتدائي</option>
<option value="3">السنة الثالثة ابتدائي</option>
<option value="2">السنة الثانية ابتدائي</option>
<option value="1">السنة الأولى ابتدائي</option>
</select>
<input id="search" placeholder="🔎 فتّش على مادة أو درس..." oninput="render()">
<p class="small">اختار مادة باش تشوف الدروس والتمارين المتوفّرة.</p>
</section>

<section class="panel">
<h2>📚 المواد الدراسية</h2>
<div id="subjects" class="grid"></div>
</section>

<section class="panel">
<h2 id="heading">📝 الدروس والتمارين</h2>
<div id="lessons"></div>
</section>

<section class="panel">
<h2>🎯 اختبار سريع في الرياضيات</h2>
<p>احسب: 25 × 4 = ؟</p>
<div class="grid">
<button onclick="answer(90)">90</button>
<button onclick="answer(100)">100</button>
<button onclick="answer(120)">120</button>
</div>
<p id="result" aria-live="polite"></p>
</section>
</main>
<footer>
ابتدائية جميلة الجديدة © 2026<br>
فضاء للتعلّم والمراجعة والنجاح
</footer>
<script>
const subjects=[
["العربية","📖"],
["الفرنسية","🇫🇷"],
["الرياضيات","➗"],
["الإيقاظ العلمي","🔬"],
["التربية الإسلامية","🌙"],
["التربية المدنية","🤝"],
["التاريخ","🏛️"],
["الجغرافيا","🌍"],
["الإنجليزية","🔤"]
];
const samples={
"العربية":[
["فهم النص","اقرأ النص بعناية، حدّد الشخصيات والمكان والزمان، ثم أجب عن الأسئلة."],
["القواعد","راجع أنواع الجمل، الفعل والفاعل، والاسم والفعل والحرف مع أمثلة من كتابك."]
],
"الفرنسية":[
["Compréhension","Lis le texte, identifie les personnages et réponds aux questions."],
["Grammaire","Révise le nom, le verbe, le sujet et la construction de phrases."]
],
"الرياضيات":[
["العمليات الحسابية","تدرّب على الجمع والطرح والضرب والقسمة، وتثبّت من النتيجة."],
["حل المسائل","اقرأ المسألة، استخرج المعطيات، حدّد المطلوب، ثم اكتب الحلّ مع الوحدة."]
],
"الإيقاظ العلمي":[
["الملاحظة والتجربة","سجّل الملاحظات، اقترح تفسيرًا، ثم قارن النتيجة بما تتوقّعه."],
["البيئة والكائنات الحية","راجع حاجات الكائنات الحية وعلاقاتها بمحيطها بالاعتماد على دروسك."]
],
"التربية الإسلامية":[
["القيم والسلوك","راجع الدرس واحرص على فهم القيم والأمثلة الواردة فيه."]
],
"التربية المدنية":[
["الحقوق والواجبات","تعرّف على حقوق الطفل وواجباته وقواعد العيش المشترك."]
],
"التاريخ":[
["ترتيب الأحداث","استعمل خطًا زمنيًا لترتيب الأحداث والشخصيات التي درستها."]
],
"الجغرافيا":[
["قراءة الخريطة","تدرّب على قراءة العنوان والمفتاح والاتجاهات وتحديد المواقع."]
],
"الإنجليزية":[
["Vocabulary","Learn the words from your lessons and use them in simple sentences."]
]
};
let selected="الرياضيات";
function render(){
const year=document.getElementById("year").value;
const q=document.getElementById("search").value.trim().toLowerCase();
document.getElementById("subjects").innerHTML=subjects
.filter(s=>s[0].toLowerCase().includes(q))
.map(s=>`<button class="subject" onclick="choose('${s[0]}')">${s[1]}<br>${s[0]}</button>`).join("");
const all=subjects.flatMap(s=>(samples[s[0]]||[]).map(l=>({subject:s[0],lesson:l[0],desc:l[1]})));
const shown=all.filter(x=>(x.subject===selected||q)&&
(!q||(x.subject+" "+x.lesson+" "+x.desc).toLowerCase().includes(q)));
document.getElementById("heading").textContent="📝 "+selected+" — السنة "+year;
document.getElementById("lessons").innerHTML=shown.length?shown.map(x=>
`<article class="lesson"><h3>${x.lesson}</h3><p>${x.desc}</p><p class="small">محتوى تمهيدي للمراجعة؛ راجع كتابك المدرسي للتفاصيل الرسمية.</p></article>`
).join(""):"<p>ما فماش نتيجة مطابقة. اختار مادة أخرى أو جرّب كلمة بحث مختلفة.</p>";
}
function choose(name){selected=name;document.getElementById("search").value="";render();document.getElementById("heading").scrollIntoView({behavior:"smooth"});}
function answer(n){document.getElementById("result").textContent=n===100?"أحسنت! إجابة صحيحة 🎉":"حاول مرة أخرى. احسب 25 × 4 من جديد.";}
render();
</script>
</body>
</html>
